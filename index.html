<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDビューア</title>
<style>
  :root {
    --bg: #f5f1e8;
    --fg: #2b2b2b;
    --accent: #6b4f3b;
    --border: #ddd4c0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ヘッダー共通: タイトルを専用行にし、その下にボタン群を折り返して配置する */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    row-gap: 8px;
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    flex: 0 0 auto;
  }
  header h1 {
    order: -1;
    flex: 1 1 100%;
    font-size: 1.1rem;
    margin: 0;
    font-weight: normal;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header button {
    background: none;
    border: 1px solid rgba(255,255,255,0.6);
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 0.85rem;
    white-space: nowrap;
    cursor: pointer;
  }
  header button:hover {
    background: rgba(255,255,255,0.15);
  }

  /* 画面切り替え */
  .screen {
    flex: 1 1 auto;
    overflow-y: auto;
    display: none;
  }
  .screen.active {
    display: block;
  }
  /* ビューア画面はヘッダー・しおりパネルを固定し、本文のみスクロールさせる */
  #screen-viewer.active {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #screen-viewer header,
  #screen-viewer .bookmark-panel,
  #screen-viewer .search-panel,
  #screen-viewer .toc-panel {
    flex: 0 0 auto;
  }
  /* 本棚一覧画面 */
  #bookshelf-list {
    padding: 16px;
  }
  .bookshelf-section {
    margin-bottom: 28px;
  }
  .bookshelf-section-title {
    font-size: 0.95rem;
    font-weight: bold;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  /* フォルダの再読み込み許可を促すバナー */
  .fs-permission-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: rgba(107, 79, 59, 0.08);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  .fs-permission-banner button {
    flex: 0 0 auto;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  .book-item {
    position: relative;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 12px;
    cursor: pointer;
    text-align: center;
    word-break: break-all;
  }
  .book-item:hover {
    border-color: var(--accent);
  }
  .book-item-source {
    font-size: 0.7rem;
    color: #999;
    margin-top: 4px;
  }
  .book-item-actions {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
  }
  .book-item-pin {
    background: none;
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .book-item-pin.pinned {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .book-item-delete {
    background: none;
    border: 1px solid var(--border);
    color: #a33;
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 4px;
    cursor: pointer;
  }

  /* バックアップパネル */
  .backup-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  .backup-panel.open {
    display: block;
  }
  .backup-panel button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    margin-right: 10px;
  }
  .backup-note {
    margin: 10px 0 0;
    font-size: 0.85rem;
    color: #777;
  }

  /* Google Driveパネル */
  .drive-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  .drive-panel.open {
    display: block;
  }
  .drive-breadcrumb {
    margin-bottom: 10px;
    font-size: 0.9rem;
    color: #555;
  }
  .drive-breadcrumb-item {
    cursor: pointer;
  }
  .drive-breadcrumb-item:hover {
    color: var(--accent);
    text-decoration: underline;
  }
  #drive-folder-list {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
    max-height: 240px;
    overflow-y: auto;
  }
  #drive-folder-list li {
    padding: 8px 4px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  #drive-folder-list li:last-child {
    border-bottom: none;
  }
  #drive-folder-list li:hover {
    color: var(--accent);
  }
  .drive-empty {
    color: #888;
    cursor: default !important;
  }
  .drive-actions button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  .drive-actions button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  /* Drive連携のエラー・案内表示 */
  .drive-message {
    display: none;
    font-size: 0.9rem;
    color: #a33;
    line-height: 1.6;
  }
  .drive-message.open {
    display: block;
  }
  .drive-message p {
    margin: 0 0 8px;
  }
  .drive-message a {
    display: inline-block;
    color: var(--accent);
    word-break: break-all;
  }
  .drive-message .drive-retry {
    display: inline-block;
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  /* 前回読み込んだDriveフォルダへのショートカット */
  .drive-last-folder {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: rgba(107, 79, 59, 0.08);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }
  .drive-last-folder.open {
    display: flex;
  }
  .drive-last-folder-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .drive-last-folder button {
    flex: 0 0 auto;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .empty-state {
    padding: 40px 16px;
    text-align: center;
    color: #888;
  }

  /* ビューア画面 */
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    row-gap: 8px;
  }
  .font-controls {
    display: flex;
    gap: 4px;
  }
  .font-controls button {
    min-width: 32px;
    padding-left: 6px;
    padding-right: 6px;
  }

  /* しおりパネル */
  .bookmark-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    flex: 0 0 auto;
  }
  .bookmark-panel.open {
    display: block;
  }
  .bookmark-add {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .bookmark-add input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.9rem;
  }
  .bookmark-add button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  #bookmark-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 200px;
    overflow-y: auto;
  }
  #bookmark-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
  }
  #bookmark-list li:last-child {
    border-bottom: none;
  }
  .bookmark-item-main {
    cursor: pointer;
    flex: 1;
  }
  .bookmark-item-main:hover {
    color: var(--accent);
  }
  .bookmark-empty {
    color: #888;
    padding: 8px 4px;
  }
  .bookmark-delete {
    background: none;
    border: none;
    color: #a33;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
  }

  /* 検索パネル */
  .search-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    flex: 0 0 auto;
  }
  .search-panel.open {
    display: block;
  }

  /* 目次パネル */
  .toc-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    max-height: 40vh;
    overflow-y: auto;
    flex: 0 0 auto;
  }
  .toc-panel.open {
    display: block;
  }
  #toc-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #toc-list li {
    padding: 8px 4px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    word-break: break-all;
  }
  #toc-list li:last-child {
    border-bottom: none;
  }
  #toc-list li:hover {
    color: var(--accent);
  }
  .toc-empty {
    color: #888;
    padding: 8px 4px;
    cursor: default;
  }
  .search-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .search-controls input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.9rem;
  }
  .search-controls button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  #search-count {
    font-size: 0.85rem;
    color: #555;
    white-space: nowrap;
    min-width: 3.5em;
    text-align: center;
  }
  #viewer-content mark.search-hit {
    background: #ffe58a;
    color: inherit;
    border-radius: 2px;
  }
  #viewer-content mark.search-hit.active {
    background: #ff9f1c;
  }

  /* 選択テキストのツールバー(Web検索・文中検索) */
  #selection-toolbar {
    display: none;
    position: fixed;
    z-index: 1000;
    gap: 6px;
  }
  #selection-toolbar.visible {
    display: flex;
  }
  #selection-toolbar button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    white-space: nowrap;
  }
  #viewer-content {
    flex: 1 1 auto;
    overflow-y: auto;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    line-height: 1.9;
    font-size: 18px;
  }
  #viewer-content h1,
  #viewer-content h2,
  #viewer-content h3,
  #viewer-content h4 {
    line-height: 1.5;
    margin: 1.6em 0 0.8em;
    color: var(--accent);
  }
  #viewer-content h1 { font-size: 1.6em; }
  #viewer-content h2 { font-size: 1.4em; }
  #viewer-content h3 { font-size: 1.2em; }
  #viewer-content p,
  #viewer-content ul,
  #viewer-content ol,
  #viewer-content blockquote {
    margin: 0.9em 0;
  }
  #viewer-content blockquote {
    margin-left: 0;
    padding: 0.2em 1em;
    border-left: 4px solid var(--border);
    color: #555;
  }
  #viewer-content code {
    background: rgba(107, 79, 59, 0.1);
    padding: 0.15em 0.4em;
    border-radius: 3px;
    font-size: 0.9em;
  }
  #viewer-content pre {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
  }
  #viewer-content pre code {
    background: none;
    padding: 0;
  }
  #viewer-content table {
    border-collapse: collapse;
    width: 100%;
  }
  #viewer-content th,
  #viewer-content td {
    border: 1px solid var(--border);
    padding: 6px 10px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- 本棚一覧画面 -->
  <section id="screen-bookshelf" class="screen active">
    <header>
      <h1>本棚</h1>
      <div class="header-actions">
        <button id="btn-drive-open" type="button">Drive</button>
        <button id="btn-backup-toggle" type="button">バックアップ</button>
        <button id="btn-import-files" type="button">ファイル</button>
        <button id="btn-open-folder" type="button">フォルダ</button>
      </div>
    </header>
    <div id="drive-panel" class="drive-panel">
      <div id="drive-message" class="drive-message"></div>
      <div id="drive-last-folder" class="drive-last-folder"></div>
      <div id="drive-breadcrumb" class="drive-breadcrumb"></div>
      <ul id="drive-folder-list"></ul>
      <div id="drive-actions" class="drive-actions">
        <button id="btn-drive-load-here" type="button">このフォルダを読み込む</button>
      </div>
    </div>
    <div id="backup-panel" class="backup-panel">
      <button id="btn-backup-export" type="button">バックアップをエクスポート</button>
      <button id="btn-backup-import" type="button">バックアップをインポート</button>
      <input type="file" id="backup-import-input" accept=".json" style="display: none;">
      <p class="backup-note">しおり・既読位置・フォントサイズ設定をJSONファイルに保存/復元します(端末間の手動同期やバックアップ用)。インポートは既存のしおりを上書きせず、更新日時の新しい方を採用してマージします。</p>
    </div>
    <input type="file" id="file-import-input" accept=".md" multiple style="display: none;">
    <div id="bookshelf-list">
      <div class="empty-state">ファイルがまだありません。「フォルダを開く」または「ファイルを追加」から読み込んでください。</div>
    </div>
  </section>

  <!-- ビューア画面 -->
  <section id="screen-viewer" class="screen">
    <header>
      <h1 id="viewer-title">タイトル</h1>
      <div class="header-actions">
        <button id="btn-back-to-bookshelf" type="button">← 本棚</button>
        <button id="btn-toc-toggle" type="button">目次</button>
        <button id="btn-search-toggle" type="button">検索</button>
        <button id="btn-bookmark-toggle" type="button">しおり</button>
        <div class="font-controls">
          <button id="btn-font-decrease" type="button" aria-label="文字を小さく">A-</button>
          <button id="btn-font-increase" type="button" aria-label="文字を大きく">A+</button>
        </div>
      </div>
    </header>
    <div id="toc-panel" class="toc-panel">
      <ul id="toc-list"></ul>
    </div>
    <div id="search-panel" class="search-panel">
      <div class="search-controls">
        <input type="text" id="search-input" placeholder="検索語を入力">
        <span id="search-count">0/0</span>
        <button id="btn-search-prev" type="button" aria-label="前へ">↑</button>
        <button id="btn-search-next" type="button" aria-label="次へ">↓</button>
      </div>
    </div>
    <div id="bookmark-panel" class="bookmark-panel">
      <div class="bookmark-add">
        <input type="text" id="bookmark-memo-input" placeholder="メモ(任意)">
        <button id="btn-bookmark-add" type="button">＋ 現在位置にしおりを追加</button>
      </div>
      <ul id="bookmark-list"></ul>
    </div>
    <div id="viewer-content"></div>
  </section>

  <div id="selection-toolbar">
    <button id="selection-search-btn" type="button">Web検索</button>
    <button id="selection-inpage-search-btn" type="button">文中検索</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  const screenBookshelf = document.getElementById('screen-bookshelf');
  const screenViewer = document.getElementById('screen-viewer');
  const btnOpenFolder = document.getElementById('btn-open-folder');
  const btnBack = document.getElementById('btn-back-to-bookshelf');
  const viewerTitle = document.getElementById('viewer-title');
  const viewerContent = document.getElementById('viewer-content');
  const bookshelfList = document.getElementById('bookshelf-list');
  const btnFontDecrease = document.getElementById('btn-font-decrease');
  const btnFontIncrease = document.getElementById('btn-font-increase');
  const btnBookmarkToggle = document.getElementById('btn-bookmark-toggle');
  const btnBookmarkAdd = document.getElementById('btn-bookmark-add');
  const bookmarkPanel = document.getElementById('bookmark-panel');
  const bookmarkMemoInput = document.getElementById('bookmark-memo-input');
  const bookmarkListEl = document.getElementById('bookmark-list');
  const btnTocToggle = document.getElementById('btn-toc-toggle');
  const tocPanel = document.getElementById('toc-panel');
  const tocListEl = document.getElementById('toc-list');
  const btnSearchToggle = document.getElementById('btn-search-toggle');
  const searchPanel = document.getElementById('search-panel');
  const searchInput = document.getElementById('search-input');
  const searchCountEl = document.getElementById('search-count');
  const btnSearchPrev = document.getElementById('btn-search-prev');
  const btnSearchNext = document.getElementById('btn-search-next');
  const selectionToolbar = document.getElementById('selection-toolbar');
  const selectionSearchBtn = document.getElementById('selection-search-btn');
  const selectionInPageSearchBtn = document.getElementById('selection-inpage-search-btn');
  const btnImportFiles = document.getElementById('btn-import-files');
  const fileImportInput = document.getElementById('file-import-input');
  const btnBackupToggle = document.getElementById('btn-backup-toggle');
  const backupPanel = document.getElementById('backup-panel');
  const btnBackupExport = document.getElementById('btn-backup-export');
  const btnBackupImport = document.getElementById('btn-backup-import');
  const backupImportInput = document.getElementById('backup-import-input');
  const btnDriveOpen = document.getElementById('btn-drive-open');
  const drivePanel = document.getElementById('drive-panel');
  const driveMessageEl = document.getElementById('drive-message');
  const driveBreadcrumbEl = document.getElementById('drive-breadcrumb');
  const driveFolderListEl = document.getElementById('drive-folder-list');
  const driveActionsEl = document.getElementById('drive-actions');
  const btnDriveLoadHere = document.getElementById('btn-drive-load-here');
  const driveLastFolderEl = document.getElementById('drive-last-folder');

  // mdFiles の各要素: { name, bookId, relPath, source: 'fs' | 'idb' | 'drive', handle?, id?, content?, fileId? }
  let mdFiles = [];
  let fsFiles = []; // フォルダ走査で見つかったファイル(セッション限り)
  let idbFilesList = []; // IndexedDBにインポート済みのファイル(永続)
  let driveFiles = []; // Google Driveから読み込んだファイル(セッション限り)
  let currentFile = null; // 現在ビューアで開いているファイル

  // フォルダハンドルの永続化(fs)。毎回フォルダを選び直さずに済むよう、
  // 選択したフォルダのハンドルをIndexedDBに保存し、起動時に読み込み権限があれば自動で再走査する。
  let fsDirHandle = null;
  let fsDirName = '';
  let fsPermissionState = null; // 'granted' | 'prompt' | 'denied' | null(未保存)

  // 本の識別子。読み込み経路(fs/idb/drive)によって relPath は変わるため、
  // しおり・既読位置はファイル名から作った安定したIDで紐づける。
  // 原稿は今後も編集されるので、本文ハッシュではなくファイル名を基準にする。
  function makeBookId(name) {
    return String(name).replace(/\.md$/i, '').normalize('NFC').trim().toLowerCase();
  }

  function recomputeMdFiles() {
    mdFiles = [...fsFiles, ...idbFilesList, ...driveFiles].sort((a, b) => a.relPath.localeCompare(b.relPath, 'ja'));
  }

  // スマホ向けファイルインポートの永続化 + フォルダハンドルの永続化(IndexedDB)
  const IDB_NAME = 'mdViewerDB';
  const IDB_VERSION = 2;
  const IDB_STORE = 'files';
  const IDB_HANDLE_STORE = 'dirHandles'; // FileSystemDirectoryHandle はstructured clone可なのでそのまま保存できる
  const IDB_HANDLE_ID = 'root'; // 現状は1フォルダのみ選択可能なため固定キー

  function openIdb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE, { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains(IDB_HANDLE_STORE)) {
          db.createObjectStore(IDB_HANDLE_STORE, { keyPath: 'id' });
        }
      };

  // Google Drive連携
  const GOOGLE_CLIENT_ID = '179784899748-ckb2osf9m7akhmd92cltfsls5mj25dac.apps.googleusercontent.com';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
  const PUBLISHED_APP_URL = 'https://kazuyuki17hmsk-ui.github.io/md-viewer/';
  const DRIVE_AUTH_TIMEOUT_MS = 120000;

  // GoogleのOAuthは https:// か localhost のオリジンしか受け付けない。
  // file:// で開いた場合はポップアップが「エラー400: invalid_request」で止まるため、事前に弾いて案内する。
  function getDriveUnavailableReason() {
    if (location.protocol === 'https:') return null;
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return null;
    if (location.protocol === 'file:') {
      return 'このページを file:// で開いているため、Google Drive連携は利用できません(Googleの仕様で https:// のオリジンが必須です)。下のリンクから公開版を開いてお使いください。';
    }
    return '現在のURL(' + location.protocol + '//' + location.host + ')ではGoogle Drive連携を利用できません。https:// のページからアクセスしてください。';
  }

  function getDriveTokenClient() {
    if (driveTokenClient) return driveTokenClient;
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return null;
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: '' // requestDriveAccessToken内で都度差し替える
    });
    return driveTokenClient;
  }

  // GISはポップアップが開けなかった場合などにcallbackではなくerror_callbackを呼ぶ。
  // これを設定しないとPromiseが永久に未解決のままになり、画面が「認証中...」で固まる。
  function describeDriveAuthError(err) {
    const type = err && err.type;
    if (type === 'popup_failed_to_open') {
      return 'Google認証のポップアップを開けませんでした。ポップアップのブロックを解除して、もう一度お試しください。';
    }
    if (type === 'popup_closed') {
      return 'Google認証のウィンドウが閉じられました。もう一度お試しください。';
    }
    return 'Google認証に失敗しました' + (type ? '(' + type + ')' : '') + '。';
  }

  function requestDriveAccessToken() {
    return new Promise((resolve, reject) => {
      const unavailable = getDriveUnavailableReason();
      if (unavailable) {
        reject(new Error(unavailable));
        return;
      }
      const client = getDriveTokenClient();
      if (!client) {
        reject(new Error('Google認証ライブラリの読み込みに失敗しました。通信環境を確認してください。'));
        return;
      }
      let settled = false;
      const timer = setTimeout(() => {
        finish(reject, new Error('Google認証がタイムアウトしました。認証ウィンドウが開いていないか確認して、もう一度お試しください。'));
      }, DRIVE_AUTH_TIMEOUT_MS);
      function finish(fn, value) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        fn(value);
      }
      client.callback = (resp) => {
        if (resp.error) {
          finish(reject, new Error('Google認証に失敗しました: ' + (resp.error_description || resp.error)));
          return;
        }
        driveAccessToken = resp.access_token;
        finish(resolve, driveAccessToken);
      };
      client.error_callback = (err) => {
        finish(reject, new Error(describeDriveAuthError(err)));
      };
      try {
        client.requestAccessToken();
      } catch (err) {
        finish(reject, new Error('Google認証を開始できませんでした: ' + err.message));
      }
    });
  }

  // 401(トークン期限切れ)なら一度だけ取り直して再試行する
  async function driveFetchWithAuth(url) {
    let res = await fetch(url, { headers: { Authorization: 'Bearer ' + driveAccessToken } });
    if (res.status === 401) {
      driveAccessToken = null;
      await requestDriveAccessToken();
      res = await fetch(url, { headers: { Authorization: 'Bearer ' + driveAccessToken } });
    }
    return res;
  }

  async function driveApiFetch(url) {
    const res = await driveFetchWithAuth(url);
    if (res.status === 401) {
      driveAccessToken = null;
      throw new Error('認証の有効期限が切れました。もう一度「Drive」ボタンから開き直してください。');
    }
    if (!res.ok) {
      throw new Error('Drive APIエラー(status ' + res.status + ')');
    }
    return res.json();
  }

  async function listDriveChildren(folderId) {
    const q = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
    const fields = encodeURIComponent('files(id,name,mimeType)');
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&pageSize=1000&orderBy=folder,name`;
    const data = await driveApiFetch(url);
    return data.files || [];
  }

  // 指定フォルダ以下を再帰的に走査し、.mdファイルを集める
  async function scanDriveFolder(folderId, relPath) {
    const children = await listDriveChildren(folderId);
    const results = [];
    for (const child of children) {
      const entryRelPath = relPath ? relPath + '/' + child.name : child.name;
      if (child.mimeType === 'application/vnd.google-apps.folder') {
        const sub = await scanDriveFolder(child.id, entryRelPath);
        results.push(...sub);
      } else if (child.name.toLowerCase().endsWith('.md')) {
        results.push({ name: child.name, bookId: makeBookId(child.name), relPath: entryRelPath, source: 'drive', fileId: child.id });
      }
    }
    return results;
  }

  const ANNOTATIONS_KEY = 'mdViewer.annotations';

  // 文字オフセット ⇄ DOM位置
  // Range→オフセットは既存の getTextOffsetInViewer()(選択ツールバーと共用)が担う。
  // ここではその逆方向と、スクロール位置からのオフセット取得を用意する。

  function getViewerPlainText() {
    return viewerContent.textContent || '';
  }

  // 文字オフセット → viewerContent内のテキストノード位置
  // 走査方法は highlightMatches() のTreeWalkerと同じ(オフセットの数え方を揃えるため)
  function locateOffsetInViewer(targetOffset) {
    const walker = document.createTreeWalker(viewerContent, NodeFilter.SHOW_TEXT, null);
    let cumulative = 0;
    let node;
    let lastNode = null;
    while ((node = walker.nextNode())) {
      const len = node.nodeValue.length;
      if (cumulative + len >= targetOffset) {
        return { node, offset: Math.max(0, targetOffset - cumulative) };
      }
      cumulative += len;
      lastNode = node;
    }
    if (lastNode) return { node: lastNode, offset: lastNode.nodeValue.length };
    return null;
  }

  function caretRangeFromPointCompat(x, y) {
    if (document.caretRangeFromPoint) {
      return document.caretRangeFromPoint(x, y);
    }
    if (document.caretPositionFromPoint) { // Firefox
      const pos = document.caretPositionFromPoint(x, y);
      if (!pos) return null;
      const range = document.createRange();
      range.setStart(pos.offsetNode, pos.offset);
      range.collapse(true);
      return range;
    }
    return null;
  }

  // 本文表示領域の上端に見えている文字のオフセットを求める(既読位置・しおりの記録用)
  function getOffsetAtViewportTop() {
    const rect = viewerContent.getBoundingClientRect();
    if (rect.height === 0) return null;
    const x = rect.left + rect.width / 2;
    // #viewer-content には上下パディングがあるため、本文に当たるまで少しずつ下へずらす
    for (const dy of [8, 24, 48, 96]) {
      const range = caretRangeFromPointCompat(x, rect.top + dy);
      if (range && viewerContent.contains(range.startContainer)) {
        return getTextOffsetInViewer(range);
      }
    }
    return null;
  }

  // 文字オフセットの位置へスクロールする
  function scrollToOffset(offset) {
    if (typeof offset !== 'number' || offset <= 0) {
      viewerContent.scrollTop = 0;
      return true;
    }
    const pos = locateOffsetInViewer(offset);
    if (!pos) return false;
    const range = document.createRange();
    range.setStart(pos.node, pos.offset);
    range.setEnd(pos.node, Math.min(pos.offset + 1, pos.node.nodeValue.length));
    const rect = range.getBoundingClientRect();
    if (rect.height === 0 && rect.width === 0) return false;
    const contentRect = viewerContent.getBoundingClientRect();
    viewerContent.scrollTop += rect.top - contentRect.top - 8;
    return true;
  }

  // 注釈のアンカー(本文が編集されてもズレを直せるようにする)
  function makeAnchor(start, end) {
    const text = getViewerPlainText();
    const s = Math.max(0, Math.min(start, text.length));
    const e = Math.max(s, Math.min(end == null ? s : end, text.length));
    const quoteEnd = e > s ? e : Math.min(text.length, s + ANCHOR_QUOTE_LEN);
    return {
      start: s,
      end: e,
      quote: text.slice(s, quoteEnd),
      prefix: text.slice(Math.max(0, s - ANCHOR_CONTEXT_LEN), s),
      suffix: text.slice(quoteEnd, quoteEnd + ANCHOR_CONTEXT_LEN)
    };
  }

  // start が本文編集でズレていたら quote / prefix / suffix から復元する
  // (W3C Web Annotation の TextQuoteSelector 相当)
  function resolveAnchor(ann, text) {
    const quote = ann.quote || '';
    const fallback = Math.max(0, Math.min(ann.start || 0, text.length));
    if (!quote) return fallback;
    if (text.substr(ann.start, quote.length) === quote) return ann.start; // ズレていない
    // 元の位置に最も近い出現を選ぶ
    const nearest = (needle, adjust) => {
      if (!needle) return -1;
      let best = -1;
      let idx = text.indexOf(needle);
      while (idx !== -1) {
        const cand = idx + adjust;
        if (best === -1 || Math.abs(cand - ann.start) < Math.abs(best - ann.start)) best = cand;
        idx = text.indexOf(needle, idx + 1);
      }
      return best;
    };
    const withContext = nearest((ann.prefix || '') + quote + (ann.suffix || ''), (ann.prefix || '').length);
    if (withContext !== -1) return withContext;
    const quoteOnly = nearest(quote, 0);
    if (quoteOnly !== -1) return quoteOnly;
    return fallback;
  }

  // 端末間マージのため、物理削除ではなく削除フラグ(tombstone)を立てる
  function deleteAnnotation(bookId, id) {
    const list = annotations[bookId];
    if (!list) return;
    const ann = list.find(a => a.id === id);
    if (!ann) return;
    ann.deleted = true;

  // 旧形式(relPathキー + scrollTop px)を新形式へ遅延変換する。
  // 本を開いてレンダリングが済んだ時点で実測するため、同じ端末・同じ文字サイズなら
  // ほぼ正確に復元できる。旧キーは残すのでロールバック可能。
  function migrateLegacyBook(bookId) {
    if (migratedBooks[bookId]) return false;
    const legacyPositions = loadJSON(LEGACY_READING_POS_KEY, {});
    const legacyBookmarks = loadJSON(LEGACY_BOOKMARKS_KEY, {});

    const basenameBookId = (key) => makeBookId(String(key).split('/').pop());

    // fs / idb / drive で最大3系統のキーに散らばっているので、すべて拾って統合する
    let legacyPx = null;
    Object.keys(legacyPositions).forEach(key => {
      if (basenameBookId(key) !== bookId) return;
      const px = legacyPositions[key];
      if (typeof px === 'number' && (legacyPx === null || px > legacyPx)) legacyPx = px; // 最も読み進んだ位置
    });

    const legacyList = [];
    Object.keys(legacyBookmarks).forEach(key => {
      if (basenameBookId(key) !== bookId) return;
      (legacyBookmarks[key] || []).forEach(bm => {
        if (!legacyList.some(x => x.id === bm.id)) legacyList.push(bm);
      });
    });

    if (legacyPx === null && legacyList.length === 0) {
      migratedBooks[bookId] = nowIso();
      saveJSON(MIGRATED_BOOKS_KEY, migratedBooks);
      return false;
    }

    const savedScrollTop = viewerContent.scrollTop;
    // px を一度実際にスクロールさせて、そこに見えている文字のオフセットを実測する
    const pxToOffset = (px) => {
      viewerContent.scrollTop = px;
      return getOffsetAtViewportTop();
    };

    if (!annotations[bookId]) annotations[bookId] = [];
    legacyList.forEach(bm => {
      if (annotations[bookId].some(a => a.id === bm.id)) return;
      const offset = pxToOffset(bm.scrollTop || 0);
      if (offset == null) return;
      const anchor = makeAnchor(offset, offset);
      annotations[bookId].push({
        id: bm.id || newId(),
        bookId,
        type: 'bookmark',
        start: anchor.start,
        end: anchor.end,
        quote: anchor.quote,
        prefix: anchor.prefix,
        suffix: anchor.suffix,
        color: null,
        note: bm.memo || '',
        createdAt: bm.createdAt || nowIso(),
        updatedAt: nowIso(),
        deleted: false
      });
    });

    if (legacyPx !== null && !readingPositions[bookId]) {
      const offset = pxToOffset(legacyPx);
      if (offset != null) readingPositions[bookId] = { offset, updatedAt: nowIso() };
    }

    viewerContent.scrollTop = savedScrollTop;
    saveAnnotations();
    saveJSON(READING_POS_V2_KEY, readingPositions);
    migratedBooks[bookId] = nowIso();
    saveJSON(MIGRATED_BOOKS_KEY, migratedBooks);
    return true;
  }

  btnBookmarkToggle.addEventListener('click', () => {

  // ファイル内検索
  let renderedHTML = ''; // 検索ハイライトをリセットするための素のレンダリング結果
  let searchMatches = [];
  let currentMatchIndex = -1;

  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function updateSearchCount() {
    searchCountEl.textContent = searchMatches.length === 0
      ? '0/0'
      : `${currentMatchIndex + 1}/${searchMatches.length}`;
  }

  function updateActiveMatch() {
    searchMatches.forEach(m => m.el.classList.remove('active'));
    if (currentMatchIndex >= 0 && searchMatches[currentMatchIndex]) {
      const active = searchMatches[currentMatchIndex].el;
      active.classList.add('active');
      active.scrollIntoView({ block: 'center' });
    }
    updateSearchCount();
  }

  // 本文プレーンテキスト上でのオフセット(文字数)を基準に、その直後の最初の一致にジャンプする
  function jumpToMatchAfterOffset(offset) {
    if (searchMatches.length === 0) return;
    let idx = searchMatches.findIndex(m => m.offset > offset);
    if (idx === -1) idx = 0; // 見つからなければ先頭(末尾から先頭へ循環)
    currentMatchIndex = idx;
    updateActiveMatch();
  }

  function highlightMatches(query) {
    viewerContent.innerHTML = renderedHTML;
    searchMatches = [];
    currentMatchIndex = -1;
    if (!query) {
      updateSearchCount();
      return;
    }
    const regex = new RegExp(escapeRegExp(query), 'gi');
    const walker = document.createTreeWalker(viewerContent, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) {
      textNodes.push(node);
    }
    let cumulativeOffset = 0;
    textNodes.forEach(textNode => {
      const text = textNode.nodeValue;
      const nodeStartOffset = cumulativeOffset;
      cumulativeOffset += text.length;
      regex.lastIndex = 0;
      if (!regex.test(text)) return;
      regex.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let lastIndex = 0;
      let m;
      while ((m = regex.exec(text))) {
        if (m.index > lastIndex) {
          frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
        }
        const mark = document.createElement('mark');
        mark.className = 'search-hit';
        mark.textContent = m[0];
        frag.appendChild(mark);
        searchMatches.push({ el: mark, offset: nodeStartOffset + m.index });
        lastIndex = m.index + m[0].length;
      }
      if (lastIndex < text.length) {
        frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      }
      textNode.parentNode.replaceChild(frag, textNode);
    });

    if (searchMatches.length > 0) {
      currentMatchIndex = 0;
      updateActiveMatch();
    } else {
      updateSearchCount();
    }
  }

  function goToMatch(delta) {
    if (searchMatches.length === 0) return;
    currentMatchIndex = (currentMatchIndex + delta + searchMatches.length) % searchMatches.length;
    updateActiveMatch();
  }

  function closeSearch() {
    searchPanel.classList.remove('open');
    searchInput.value = '';
    if (renderedHTML) viewerContent.innerHTML = renderedHTML;
    searchMatches = [];
    currentMatchIndex = -1;
    updateSearchCount();
  }

  searchInput.addEventListener('input', () => {
    highlightMatches(searchInput.value.trim());
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      goToMatch(e.shiftKey ? -1 : 1);
    }
  });
  btnSearchPrev.addEventListener('click', () => goToMatch(-1));
  btnSearchNext.addEventListener('click', () => goToMatch(1));

  // 選択テキストのWeb検索・文中検索
  let pendingSelectionText = '';
  let pendingSelectionOffset = 0; // viewer-content内のプレーンテキスト上でのオフセット(文字数)

  function hideSelectionButton() {
    selectionToolbar.classList.remove('visible');
    pendingSelectionText = '';
  }

  // range開始位置の、viewerContent内プレーンテキスト先頭からの文字数オフセットを求める
  function getTextOffsetInViewer(range) {
    const preRange = document.createRange();
    preRange.selectNodeContents(viewerContent);
    preRange.setEnd(range.startContainer, range.startOffset);
    return preRange.toString().length;
  }

  function showSelectionButtonForSelection() {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
      hideSelectionButton();
      return;
    }
    const text = selection.toString().trim();
    if (!text || !viewerContent.contains(selection.anchorNode)) {
      hideSelectionButton();
      return;
    }
    const range = selection.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) {
      hideSelectionButton();
      return;
    }
    pendingSelectionText = text;
    pendingSelectionOffset = getTextOffsetInViewer(range);
    selectionToolbar.classList.add('visible');
    const toolbarRect = selectionToolbar.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - toolbarRect.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - toolbarRect.width - 8));
    let top = rect.top - toolbarRect.height - 8;
    if (top < 8) top = rect.bottom + 8;
    selectionToolbar.style.left = left + 'px';
    selectionToolbar.style.top = top + 'px';
  }

  viewerContent.addEventListener('mouseup', () => {
    setTimeout(showSelectionButtonForSelection, 0);
  });
  viewerContent.addEventListener('touchend', () => {
    setTimeout(showSelectionButtonForSelection, 0);
  });
  viewerContent.addEventListener('scroll', hideSelectionButton);
  document.addEventListener('selectionchange', () => {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed) {
      hideSelectionButton();
    }
  });
  document.addEventListener('mousedown', (e) => {
    if (!selectionToolbar.contains(e.target)) {

  selectionToolbar.addEventListener('mousedown', (e) => {

  });
  selectionSearchBtn.addEventListener('click', () => {

  // フォントサイズ調整
  const FONT_SIZE_KEY = 'mdViewer.fontSize';
  const FONT_SIZE_MIN = 14;
  const FONT_SIZE_MAX = 28;
  const FONT_SIZE_DEFAULT = 18;
  const FONT_SIZE_STEP = 2;

  let fontSize = parseInt(localStorage.getItem(FONT_SIZE_KEY), 10);
  if (!fontSize || isNaN(fontSize)) fontSize = FONT_SIZE_DEFAULT;

  function applyFontSize() {
    viewerContent.style.fontSize = fontSize + 'px';
  }

  function changeFontSize(delta) {
    fontSize = Math.min(FONT_SIZE_MAX, Math.max(FONT_SIZE_MIN, fontSize + delta));
    localStorage.setItem(FONT_SIZE_KEY, String(fontSize));
    applyFontSize();
  }

  btnFontDecrease.addEventListener('click', () => changeFontSize(-FONT_SIZE_STEP));
  btnFontIncrease.addEventListener('click', () => changeFontSize(FONT_SIZE_STEP));
  applyFontSize();

  function showScreen(screen) {
    [screenBookshelf, screenViewer].forEach(s => s.classList.remove('active'));
    screen.classList.add('active');

  function renderMarkdown(text) {
    if (window.marked) {
      viewerContent.innerHTML = window.marked.parse(text);
    } else {
      // marked.js読み込み失敗時のフォールバック: 生テキスト表示

  async function openViewer(file) {
    currentFile = file;
    lastOpenedAt[file.bookId] = nowIso();
    saveJSON(LAST_OPENED_KEY, lastOpenedAt);
    viewerTitle.textContent = file.name;
    viewerContent.textContent = '読み込み中...';
    bookmarkPanel.classList.remove('open');
    bookmarkMemoInput.value = '';
    searchPanel.classList.remove('open');
    searchInput.value = '';
    searchMatches = [];
    currentMatchIndex = -1;
    updateSearchCount();
    tocPanel.classList.remove('open');
    hideSelectionButton();
    showScreen(screenViewer);
    try {
      let text;
      if (file.source === 'idb') {
        text = file.content;
      } else if (file.source === 'drive') {
        text = await fetchDriveFileContent(file.fileId);
      } else {
        const fileHandle = await file.handle.getFile();
        text = await fileHandle.text();
      }
      renderMarkdown(text);
      buildToc();
      renderedHTML = viewerContent.innerHTML;
      migrateLegacyBook(file.bookId); // 旧形式(px)のしおりがあれば文字オフセットへ変換
      renderBookmarkList();

      scrollToOffset(saved ? saved.offset : 0);
    } catch (err) {
      viewerContent.textContent = 'ファイルの読み込みに失敗しました: ' + err.message;

  // ディレクトリを再帰的に走査し、.mdファイルのハンドルを集める
  async function scanDirectory(dirHandle, relPath) {
    const results = [];
    for await (const [name, handle] of dirHandle.entries()) {
      const entryRelPath = relPath ? relPath + '/' + name : name;
      if (handle.kind === 'file' && name.toLowerCase().endsWith('.md')) {
        results.push({ name, bookId: makeBookId(name), relPath: entryRelPath, source: 'fs', handle });
      } else if (handle.kind === 'directory') {
        const sub = await scanDirectory(handle, entryRelPath);
        results.push(...sub);
      }
    }
    return results;
  }

  function createBookItem(file) {

      sourceEl.textContent = 'Drive';

    } else if (file.source === 'fs') {

      sourceEl.textContent = 'フォルダ';
      item.appendChild(sourceEl);

    pinBtn.addEventListener('click', (e) => {

    });
    actions.appendChild(pinBtn);

    if (file.source === 'idb') {
      const delBtn = document.createElement('button');
      delBtn.className = 'book-item-delete';
      delBtn.type = 'button';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', async (e) => {

    item.appendChild(actions);

  // フォルダの再読み込み許可を促すバナー(fsハンドルはあるが読み込み権限が失効している場合)
  function renderFsPermissionBanner(container) {
    if (!fsDirHandle || fsPermissionState === 'granted') return;
    const banner = document.createElement('div');
    banner.className = 'fs-permission-banner';
    const label = document.createElement('div');
    label.textContent = '前回のフォルダ「' + fsDirName + '」を読み込むには許可が必要です。';
    banner.appendChild(label);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '許可する';
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const perm = await fsDirHandle.requestPermission({ mode: 'read' });
        fsPermissionState = perm;
        if (perm === 'granted') {
          fsFiles = await scanDirectory(fsDirHandle, '');
          recomputeMdFiles();
        } else {
          alert('読み込みが許可されませんでした。「フォルダ」ボタンから選び直してください。');
        }
      } catch (err) {
        alert('許可の取得に失敗しました: ' + err.message);
      } finally {
        renderBookshelf();
      }
    });
    banner.appendChild(btn);
    container.appendChild(banner);
  }

  function renderBookshelf() {
    bookshelfList.innerHTML = '';
    renderFsPermissionBanner(bookshelfList);

    if (mdFiles.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'ファイルがまだありません。「フォルダを開く」または「ファイルを追加」から読み込んでください。';
      bookshelfList.appendChild(empty);
      return;
    }

    // 読書中(ピン留め)・最近読んだ には、bookIdが重複するエントリ(同じ本を複数経路で
    // 読み込んでいる場合)を1つにまとめて出す。「すべて」は経路ごとの実体をそのまま出す。
    const seen = new Set();
    const uniqueByBookId = mdFiles.filter(f => {
      if (seen.has(f.bookId)) return false;
      seen.add(f.bookId);
      return true;
    });

    const pinned = uniqueByBookId
      .filter(f => isPinned(f.bookId))
      .sort((a, b) => (pinnedBooks[b.bookId] || '').localeCompare(pinnedBooks[a.bookId] || ''));

    const recent = uniqueByBookId
      .filter(f => !isPinned(f.bookId) && lastOpenedAt[f.bookId])
      .sort((a, b) => (lastOpenedAt[b.bookId] || '').localeCompare(lastOpenedAt[a.bookId] || ''))
      .slice(0, RECENT_BOOKS_LIMIT);

    renderBookshelfSection(bookshelfList, '読書中', pinned);
    renderBookshelfSection(bookshelfList, '最近読んだ', recent);
    renderBookshelfSection(bookshelfList, 'すべて', mdFiles);
  }

  btnOpenFolder.addEventListener('click', async () => {
    if (!window.showDirectoryPicker) {
      alert('お使いのブラウザはフォルダ読み込みに対応していません。Chromebookでは「フォルダを開く」、スマホでは「ファイルを追加」をお使いください。');
      return;
    }
    try {
      const dirHandle = await window.showDirectoryPicker();
      bookshelfList.innerHTML = '';
      const loading = document.createElement('div');
      loading.className = 'empty-state';
      loading.textContent = 'フォルダを読み込み中...';
      bookshelfList.appendChild(loading);

      fsFiles = await scanDirectory(dirHandle, '');
      fsDirHandle = dirHandle;
      fsDirName = dirHandle.name;
      fsPermissionState = 'granted';
      recomputeMdFiles();
      renderBookshelf();
      try {
        await idbSaveDirHandle(dirHandle, dirHandle.name);
      } catch (err) {
        // ハンドル保存に失敗しても今回のセッションでの閲覧自体は継続できるので握りつぶす
      }
    } catch (err) {
      if (err.name !== 'AbortError') {
        alert('フォルダの読み込みに失敗しました: ' + err.message);
      }
    }
  });

  btnImportFiles.addEventListener('click', () => {
    fileImportInput.click();
  });

  async function importFiles(fileList) {
    const files = Array.from(fileList || []);
    const mdOnly = files.filter(f => f.name.toLowerCase().endsWith('.md'));
    for (const f of mdOnly) {
      try {
        const content = await f.text();
        const record = await idbAddFile(f.name, content);
        idbFilesList.push({ name: record.name, bookId: makeBookId(record.name), relPath: record.name, source: 'idb', id: record.id, content: record.content });
      } catch (err) {
        alert(f.name + ' の読み込みに失敗しました: ' + err.message);
      }
    }
    recomputeMdFiles();
    renderBookshelf();
  }

  fileImportInput.addEventListener('change', async () => {
    await importFiles(fileImportInput.files);
    fileImportInput.value = ''; // 同じファイルを続けて選択できるようにリセット
  });

  // バックアップ(しおり・既読位置・フォント設定)のJSONエクスポート/インポート
  btnBackupToggle.addEventListener('click', () => {
    const willOpen = !backupPanel.classList.contains('open');
    backupPanel.classList.toggle('open', willOpen);
    if (willOpen) {
      drivePanel.classList.remove('open');
    }
  });

  function exportBackup() {
    const data = {
      version: 2,
      exportedAt: nowIso(),
      annotations,
      readingPositions,
      fontSize
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const a = document.createElement('a');
    a.href = url;
    a.download = `md-viewer-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function importBackup(file) {
    let data;
    try {
      const text = await file.text();
      data = JSON.parse(text);
    } catch (err) {
      alert('バックアップファイルの読み込みに失敗しました: ' + err.message);
      return;
    }
    if (!data || typeof data !== 'object') {
      alert('不正なバックアップファイルです。');
      return;
    }

    let added = 0;
    let updated = 0;

    // 旧形式(version 1)は relPath + px なので、そのまま旧キーへマージしておく。
    // 次にその本を開いた時に migrateLegacyBook() が文字オフセットへ変換する。
    if (data.bookmarks && typeof data.bookmarks === 'object') {
      const legacy = loadJSON(LEGACY_BOOKMARKS_KEY, {});
      Object.keys(data.bookmarks).forEach(key => {
        if (!Array.isArray(data.bookmarks[key])) return;
        if (!legacy[key]) legacy[key] = [];
        data.bookmarks[key].forEach(bm => {
          if (legacy[key].some(x => x.id === bm.id)) return;
          legacy[key].push(bm);
          added++;
        });
        // 取り込んだ本は再変換の対象に戻す
        delete migratedBooks[makeBookId(String(key).split('/').pop())];
      });
      saveJSON(LEGACY_BOOKMARKS_KEY, legacy);
      saveJSON(MIGRATED_BOOKS_KEY, migratedBooks);
    }
    if (data.version === 1 && data.readingPositions && typeof data.readingPositions === 'object') {
      const legacyPos = loadJSON(LEGACY_READING_POS_KEY, {});
      Object.keys(data.readingPositions).forEach(key => {
        const px = data.readingPositions[key];
        if (typeof px !== 'number') return;
        if (typeof legacyPos[key] !== 'number' || px > legacyPos[key]) legacyPos[key] = px;
        delete migratedBooks[makeBookId(String(key).split('/').pop())];
      });
      saveJSON(LEGACY_READING_POS_KEY, legacyPos);
      saveJSON(MIGRATED_BOOKS_KEY, migratedBooks);
    }

    // 新形式(version 2): 全上書きせず、注釈id単位で updatedAt の新しい方を採用する。
    // これで「Chromebookでしおり追加 → スマホでメモ編集」が両方残る。
    if (data.annotations && typeof data.annotations === 'object') {
      Object.keys(data.annotations).forEach(bookId => {
        const incoming = data.annotations[bookId];
        if (!Array.isArray(incoming)) return;
        if (!annotations[bookId]) annotations[bookId] = [];
        const local = annotations[bookId];
        incoming.forEach(ann => {
          if (!ann || !ann.id) return;
          const existing = local.find(a => a.id === ann.id);
          if (!existing) {
            local.push(ann);
            added++;
          } else if ((ann.updatedAt || '') > (existing.updatedAt || '')) {
            Object.assign(existing, ann); // 削除フラグも「新しい更新」として尊重する
            updated++;
          }
        });
      });
      saveAnnotations();
    }
    if (data.version !== 1 && data.readingPositions && typeof data.readingPositions === 'object') {
      Object.keys(data.readingPositions).forEach(bookId => {
        const entry = data.readingPositions[bookId];
        if (!entry || typeof entry.offset !== 'number') return;
        const existing = readingPositions[bookId];
        if (!existing || (entry.updatedAt || '') > (existing.updatedAt || '')) {
          readingPositions[bookId] = entry;
          updated++;
        }
      });
      saveJSON(READING_POS_V2_KEY, readingPositions);
    }

    if (typeof data.fontSize === 'number' && data.fontSize >= FONT_SIZE_MIN && data.fontSize <= FONT_SIZE_MAX) {
      fontSize = data.fontSize;
      localStorage.setItem(FONT_SIZE_KEY, String(fontSize));
      applyFontSize();
    }

    if (currentFile) renderBookmarkList();
    alert(`バックアップを取り込みました(追加 ${added}件 / 更新 ${updated}件)。\n既存のしおりは上書きせずマージしています。`);
  }

  btnBackupExport.addEventListener('click', exportBackup);
  btnBackupImport.addEventListener('click', () => {
    backupImportInput.click();
  });
  backupImportInput.addEventListener('change', async () => {
    const file = backupImportInput.files && backupImportInput.files[0];
    if (file) {
      await importBackup(file);
    }
    backupImportInput.value = '';
  });

  // 前回選択したフォルダのハンドルを復元する。読み込み権限が生きていれば自動で再走査し、
  // 失効していれば renderBookshelf() が案内バナーを出す(requestPermissionはユーザー操作起点でしか呼べないため)。
  async function restoreFsHandle() {
    try {
      const rec = await idbGetDirHandle();
      if (!rec || !rec.handle) return;
      fsDirHandle = rec.handle;
      fsDirName = rec.name || '';
      if (typeof fsDirHandle.queryPermission !== 'function') {
        fsPermissionState = 'prompt';
        return;
      }
      fsPermissionState = await fsDirHandle.queryPermission({ mode: 'read' });
      if (fsPermissionState === 'granted') {
        fsFiles = await scanDirectory(fsDirHandle, '');
      }
    } catch (err) {
      // ハンドルが壊れている(フォルダが削除された等)場合は諦めて次回選び直してもらう
      fsDirHandle = null;
      fsPermissionState = null;
    }
  }

  async function init() {
    try {
      const records = await idbGetAllFiles();
      idbFilesList = records.map(r => ({ name: r.name, bookId: makeBookId(r.name), relPath: r.name, source: 'idb', id: r.id, content: r.content }));
    } catch (err) {
      idbFilesList = [];
    }
    await restoreFsHandle();
    restoreDriveCache();
    recomputeMdFiles();
    renderBookshelf();
  }
  init();
})();
</script>
</body>
</html>
