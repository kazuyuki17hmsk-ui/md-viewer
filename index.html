  async function importBackup(file) {
    let data;
    try {
      const text = await file.text();
      data = JSON.parse(text);
    } catch (err) {
      alert('バックアップファイルの読み込みに失敗しました: ' + err.message);
      return;
    }
    if (!data || typeof data !== 'object') {
      alert('不正なバックアップファイルです。');
      return;
    }

    let added = 0;
    let updated = 0;

    // 旧形式(version 1)は relPath + px なので、そのまま旧キーへマージしておく。
    // 次にその本を開いた時に migrateLegacyBook() が文字オフセットへ変換する。
    if (data.bookmarks && typeof data.bookmarks === 'object') {
      const legacy = loadJSON(LEGACY_BOOKMARKS_KEY, {});
      Object.keys(data.bookmarks).forEach(key => {
        if (!Array.isArray(data.bookmarks[key])) return;
        if (!legacy[key]) legacy[key] = [];
        data.bookmarks[key].forEach(bm => {
          if (legacy[key].some(x => x.id === bm.id)) return;
          legacy[key].push(bm);
          added++;
        });
        // 取り込んだ本は再変換の対象に戻す
        delete migratedBooks[makeBookId(String(key).split('/').pop())];
      });
      saveJSON(LEGACY_BOOKMARKS_KEY, legacy);
      persistMigratedBooks();
    }
    if (data.version === 1 && data.readingPositions && typeof data.readingPositions === 'object') {
      const legacyPos = loadJSON(LEGACY_READING_POS_KEY, {});
      Object.keys(data.readingPositions).forEach(key => {
        const px = data.readingPositions[key];
        if (typeof px !== 'number') return;
        if (typeof legacyPos[key] !== 'number' || px > legacyPos[key]) legacyPos[key] = px;
        delete migratedBooks[makeBookId(String(key).split('/').pop())];
      });
      saveJSON(LEGACY_READING_POS_KEY, legacyPos);
      persistMigratedBooks();
    }

    // 新形式(version 2): 全上書きせず、注釈id単位で updatedAt の新しい方を採用する。
    // これで「Chromebookでしおり追加 → スマホでメモ編集」が両方残る。
    if (data.annotations && typeof data.annotations === 'object') {
      Object.keys(data.annotations).forEach(bookId => {
        const r = mergeAnnotationList(bookId, data.annotations[bookId]);
        added += r.added;
        updated += r.updated;
      });
      saveAnnotations();
    }
    if (data.version !== 1 && data.readingPositions && typeof data.readingPositions === 'object') {
      Object.keys(data.readingPositions).forEach(bookId => {
        if (mergeReadingPosition(bookId, data.readingPositions[bookId])) updated++;
      });
      persistReadingPositions();
    }

    if (typeof data.fontSize === 'number' && data.fontSize >= FONT_SIZE_MIN && data.fontSize <= FONT_SIZE_MAX) {
      fontSize = data.fontSize;
      localStorage.setItem(FONT_SIZE_KEY, String(fontSize));
      applyFontSize();
    }

    if (currentFile) renderBookmarkList();
    alert(`バックアップを取り込みました(追加 ${added}件 / 更新 ${updated}件)。\n既存のしおりは上書きせずマージしています。`);
  }

  // Drive appDataFolder による注釈の自動同期
  // 同期単位は「本ごとに1ファイル」。全体を1ファイルにすると端末間の衝突が頻発するため。
  const APPDATA_FILE_PREFIX = 'ann-';
  const SYNC_DEBOUNCE_MS = 6000;

  let appDataFileIndex = null; // { ファイル名: fileId }
  let syncInProgress = false;  // マージ時のsaveがまた同期を予約するのを防ぐ
  let syncPushTimer = null;
  const pendingSyncBooks = new Set();
  let driveLastSyncAt = loadJSON(DRIVE_LAST_SYNC_KEY, null);

  function setSyncStatus(text, isError) {
    syncStatusEl.textContent = text || '';
    syncStatusEl.classList.toggle('error', !!isError);
  }

  function renderSyncStatus() {
    if (!driveSyncEnabled) {
      setSyncStatus('同期はオフです。');
      return;
    }
    setSyncStatus(driveLastSyncAt
      ? '最終同期: ' + new Date(driveLastSyncAt).toLocaleString('ja-JP')
      : '未同期です。「今すぐ同期」を押してください。');
  }

  function syncFileNameFor(bookId) {
    // bookIdは日本語を含みうるのでURIエンコードしてファイル名に使う
    return APPDATA_FILE_PREFIX + encodeURIComponent(bookId) + '.json';
  }
  function bookIdFromSyncFileName(name) {
    if (!name.startsWith(APPDATA_FILE_PREFIX) || !name.endsWith('.json')) return null;
    try {
      return decodeURIComponent(name.slice(APPDATA_FILE_PREFIX.length, -5));
    } catch (err) {
      return null;
    }
  }

  // ローカルとリモートが実質同じかを比較するための署名。同じなら書き込みを省く
  function syncSignature(list, pos) {
    const arr = (list || []).slice().sort((a, b) => ((a.id || '') < (b.id || '') ? -1 : 1));
    return JSON.stringify({
      a: arr.map(a => [a.id, a.updatedAt || '', a.deleted ? 1 : 0]),
      p: pos ? (pos.updatedAt || '') : null
    });
  }

  async function loadAppDataIndex(force) {
    if (appDataFileIndex && !force) return appDataFileIndex;
    const fields = encodeURIComponent('files(id,name)');
    const url = `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=${fields}&pageSize=1000`;
    const data = await driveApiFetch(url);
    const index = {};
    (data.files || []).forEach(f => { index[f.name] = f.id; });
    appDataFileIndex = index;
    return index;
  }

  async function appDataDownload(fileId) {
    const res = await driveFetchWithAuth(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if (!res.ok) throw new Error('同期データの取得に失敗しました(status ' + res.status + ')');
    return res.json();
  }

  async function appDataUpload(name, fileId, obj, isRetry) {
    const boundary = 'mdv' + Math.random().toString(36).slice(2);
    const metadata = fileId ? { name } : { name, parents: ['appDataFolder'] };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
      JSON.stringify(metadata) +
      `\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
      JSON.stringify(obj) +
      `\r\n--${boundary}--`;
    const url = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart&fields=id`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id';
    const res = await fetch(url, {
      method: fileId ? 'PATCH' : 'POST',
      headers: {
        Authorization: 'Bearer ' + driveAccessToken,
        'Content-Type': `multipart/related; boundary=${boundary}`
      },
      body
    });
    if (res.status === 401 && !isRetry) {
      driveAccessToken = null;
      await requestDriveAccessToken();
      return appDataUpload(name, fileId, obj, true); // 再試行は一度だけ(無限ループ防止)
    }
    if (!res.ok) throw new Error('同期データの保存に失敗しました(status ' + res.status + ')');
    const json = await res.json();
    return json.id;
  }

  // 1冊分の同期。必ず pull → マージ → push の順で行う。
  // 先にpushすると、リモートにある他端末の新しい変更を古いデータで潰してしまう。
  async function syncBook(bookId) {
    const index = await loadAppDataIndex();
    const name = syncFileNameFor(bookId);
    const fileId = index[name] || null;

    let pulled = false;
    let remoteSig = null;
    if (fileId) {
      const remote = await appDataDownload(fileId);
      if (remote && typeof remote === 'object') {
        remoteSig = syncSignature(remote.annotations, remote.readingPosition);
        const r = mergeAnnotationList(bookId, remote.annotations);
        if (r.added || r.updated) pulled = true;
        if (mergeReadingPosition(bookId, remote.readingPosition)) pulled = true;
      }
    }
    if (pulled) {
      saveAnnotations();
      persistReadingPositions();
    }

    const list = annotations[bookId] || [];
    const pos = readingPositions[bookId] || null;

    // 安全弁: ローカルが空なのにリモートにデータがある場合は上書きしない。
    // 削除はtombstoneで残るので、配列が完全に空になるのは異常(データ消失事故)の兆候。
    if (list.length === 0 && !pos) {
      return { pulled, pushed: false };
    }
    if (fileId && syncSignature(list, pos) === remoteSig) {
      return { pulled, pushed: false }; // 中身が同じなら書き込まない
    }

    const newFileId = await appDataUpload(name, fileId, {
      version: 2,
      bookId,
      updatedAt: nowIso(),
      annotations: list,
      readingPosition: pos
    });
    appDataFileIndex[name] = newFileId;
    return { pulled, pushed: true };
  }

  async function ensureSyncToken() {
    if (driveAccessToken && hasAppDataScope()) return;
    await requestDriveAccessToken();
    if (!hasAppDataScope()) {
      throw new Error('同期に必要な権限(appDataFolder)が許可されませんでした。');
    }
  }

  async function runSyncAll() {
    if (syncInProgress) return;
    const reason = getDriveUnavailableReason();
    if (reason) {
      setSyncStatus(reason, true);
      return;
    }
    syncInProgress = true;
    btnSyncNow.disabled = true;
    setSyncStatus('同期中...');
    try {
      await ensureSyncToken();
      const index = await loadAppDataIndex(true);
      const ids = new Set();
      Object.keys(annotations).forEach(id => ids.add(id));
      Object.keys(readingPositions).forEach(id => ids.add(id));
      Object.keys(index).forEach(name => {
        const id = bookIdFromSyncFileName(name);
        if (id) ids.add(id);
      });

      let pulledCount = 0;
      let pushedCount = 0;
      const failed = [];
      for (const bookId of ids) {
        try {
          const r = await syncBook(bookId);
          if (r.pulled) pulledCount++;
          if (r.pushed) pushedCount++;
        } catch (err) {
          failed.push(bookId);
        }
      }

      driveLastSyncAt = nowIso();
      saveJSON(DRIVE_LAST_SYNC_KEY, driveLastSyncAt);
      if (currentFile) {
        rebuildContentLayers();
        renderBookmarkList();
      }
      const summary = `同期しました(${ids.size}冊 / 取得 ${pulledCount} / 送信 ${pushedCount})`;
      setSyncStatus(failed.length ? summary + ` ※${failed.length}冊は失敗` : summary, failed.length > 0);
    } catch (err) {
      setSyncStatus(err.message, true);
    } finally {
      syncInProgress = false;
      btnSyncNow.disabled = false;
    }
  }

  // 注釈を変更したら少し待ってから該当の本だけ送る。
  // トークンが無い間は何もしない(勝手に認証ポップアップを開かないため)。
  function scheduleSync(bookId) {
    if (!driveSyncEnabled || !bookId || syncInProgress) return;
    if (!driveAccessToken || !hasAppDataScope()) return;
    pendingSyncBooks.add(bookId);
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(runPendingSync, SYNC_DEBOUNCE_MS);
  }

  // 本を開いた直後に、その本だけ裏で同期する。
  // 読書位置はマージするだけでスクロールはしない(読んでいる最中に画面が飛ぶのを避けるため)。
  function pullBookInBackground(bookId) {
    if (!driveSyncEnabled || syncInProgress) return;
    if (!driveAccessToken || !hasAppDataScope()) return;
    syncInProgress = true;
    syncBook(bookId)
      .then(r => {
        if (r.pulled && currentFile && currentFile.bookId === bookId) {
          rebuildContentLayers();
          renderBookmarkList();
        }
      })
      .catch(() => { /* 裏での同期失敗は読書を妨げないので黙って諦める */ })
      .finally(() => { syncInProgress = false; });
  }

  async function runPendingSync() {
    if (syncInProgress || pendingSyncBooks.size === 0) return;
    const ids = Array.from(pendingSyncBooks);
    pendingSyncBooks.clear();
    syncInProgress = true;
    try {
      for (const bookId of ids) {
        await syncBook(bookId);
      }
      driveLastSyncAt = nowIso();
      saveJSON(DRIVE_LAST_SYNC_KEY, driveLastSyncAt);
      renderSyncStatus();
    } catch (err) {
      setSyncStatus('自動同期に失敗しました: ' + err.message, true);
    } finally {
      syncInProgress = false;
    }
  }

  driveSyncToggle.addEventListener('change', async () => {
    if (!driveSyncToggle.checked) {
      driveSyncEnabled = false;
      saveJSON(DRIVE_SYNC_ENABLED_KEY, false);
      renderSyncStatus();
      return;
    }
    const reason = getDriveUnavailableReason();
    if (reason) {
      driveSyncToggle.checked = false;
      setSyncStatus(reason, true);
      return;
    }
    // スコープを広げるため、先にフラグを立ててからトークンを取り直す
    driveSyncEnabled = true;
    saveJSON(DRIVE_SYNC_ENABLED_KEY, true);
    driveAccessToken = null;
    driveGrantedScopes = '';
    try {
      setSyncStatus('Google認証中...');
      await ensureSyncToken();
      await runSyncAll();
    } catch (err) {
      driveSyncEnabled = false;
      saveJSON(DRIVE_SYNC_ENABLED_KEY, false);
      driveSyncToggle.checked = false;
      setSyncStatus(err.message, true);
    }
  });

  btnSyncNow.addEventListener('click', () => {
    if (!driveSyncEnabled) {
      setSyncStatus('先に「自動同期する」をオンにしてください。', true);
      return;
    }
    runSyncAll();
  });

  // 前回選択したフォルダのハンドルを復元する。読み込み権限が生きていれば自動で再走査し、
  // 失効していれば renderBookshelf() が案内バナーを出す(requestPermissionはユーザー操作起点でしか呼べないため)。
  async function restoreFsHandle() {
    try {
      const rec = await idbGetDirHandle();
      if (!rec || !rec.handle) return;
      fsDirHandle = rec.handle;
      fsDirName = rec.name || '';
      if (typeof fsDirHandle.queryPermission !== 'function') {
        fsPermissionState = 'prompt';
        return;
      }
      fsPermissionState = await fsDirHandle.queryPermission({ mode: 'read' });
      if (fsPermissionState === 'granted') {
        fsFiles = await scanDirectory(fsDirHandle, '');
      }
    } catch (err) {
      // ハンドルが壊れている(フォルダが削除された等)場合は諦めて次回選び直してもらう
      fsDirHandle = null;
      fsPermissionState = null;
    }
  }

  async function init() {
    try {
      const records = await idbGetAllFiles();
      idbFilesList = records.map(r => ({ name: r.name, bookId: makeBookId(r.name), relPath: r.name, source: 'idb', id: r.id, content: r.content }));
    } catch (err) {
      idbFilesList = [];
    }
    // 注釈・既読位置・マイグレーション記録をIndexedDBから読み込む(無ければlocalStorageから複製)。
    // 本棚描画より前に完了させ、本を開く操作が発生する前に必ず読み込みを終える。
    try {
      annotations = await loadPersistedOrMigrate('annotations', ANNOTATIONS_KEY, {});
      readingPositions = await loadPersistedOrMigrate('readingPositions', READING_POS_V2_KEY, {});
      migratedBooks = await loadPersistedOrMigrate('migratedBooks', MIGRATED_BOOKS_KEY, {});
    } catch (err) {
      // IndexedDBが完全に使えない場合、初期値({})のまま続行する
    }
    await restoreFsHandle();
    restoreDriveCache();
    recomputeMdFiles();
    renderBookshelf();
    driveSyncToggle.checked = driveSyncEnabled;
    renderSyncStatus();
  }
  init();

  // オフライン読書用のService Worker登録。file://では仕様上登録できないため無条件にtryし、
  // 失敗しても黙って諦める(Drive連携と同じく「非対応環境では機能が単に効かないだけ」)。
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
