<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDビューア</title>
<style>
  :root {
    --bg: #f5f1e8;
    --fg: #2b2b2b;
    --accent: #6b4f3b;
    --border: #ddd4c0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ヘッダー共通 */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    flex: 0 0 auto;
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0;
    font-weight: normal;
  }
  header button {
    background: none;
    border: 1px solid rgba(255,255,255,0.6);
    color: #fff;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  header button:hover {
    background: rgba(255,255,255,0.15);
  }

  /* 画面切り替え */
  .screen {
    flex: 1 1 auto;
    overflow-y: auto;
    display: none;
  }
  .screen.active {
    display: block;
  }
  /* ビューア画面はヘッダー・しおりパネルを固定し、本文のみスクロールさせる */
  #screen-viewer.active {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #screen-viewer header,
  #screen-viewer .bookmark-panel,
  #screen-viewer .search-panel,
  #screen-viewer .toc-panel {
    flex: 0 0 auto;
  }
  /* ビューアのヘッダーは、幅が足りない場合にタイトルを専用行に折り返す */
  #screen-viewer header {
    flex-wrap: wrap;
    row-gap: 8px;
  }
  #screen-viewer header h1 {
    order: -1;
    flex: 1 1 100%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 本棚一覧画面 */
  #bookshelf-list {
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .book-item {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 12px;
    cursor: pointer;
    text-align: center;
    word-break: break-all;
  }
  .book-item:hover {
    border-color: var(--accent);
  }
  .book-item-source {
    font-size: 0.7rem;
    color: #999;
    margin-top: 4px;
  }
  .book-item-delete {
    margin-top: 8px;
    background: none;
    border: 1px solid var(--border);
    color: #a33;
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 4px;
    cursor: pointer;
  }

  /* バックアップパネル */
  .backup-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  .backup-panel.open {
    display: block;
  }
  .backup-panel button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    margin-right: 10px;
  }
  .backup-note {
    margin: 10px 0 0;
    font-size: 0.85rem;
    color: #777;
  }

  /* Google Driveパネル */
  .drive-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  .drive-panel.open {
    display: block;
  }
  .drive-breadcrumb {
    margin-bottom: 10px;
    font-size: 0.9rem;
    color: #555;
  }
  .drive-breadcrumb-item {
    cursor: pointer;
  }
  .drive-breadcrumb-item:hover {
    color: var(--accent);
    text-decoration: underline;
  }
  #drive-folder-list {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
    max-height: 240px;
    overflow-y: auto;
  }
  #drive-folder-list li {
    padding: 8px 4px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  #drive-folder-list li:last-child {
    border-bottom: none;
  }
  #drive-folder-list li:hover {
    color: var(--accent);
  }
  .drive-empty {
    color: #888;
    cursor: default !important;
  }
  .drive-actions button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  .drive-actions button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .empty-state {
    padding: 40px 16px;
    text-align: center;
    color: #888;
  }

  /* ビューア画面 */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .font-controls {
    display: flex;
    gap: 6px;
  }
  .font-controls button {
    min-width: 36px;
  }

  /* しおりパネル */
  .bookmark-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    flex: 0 0 auto;
  }
  .bookmark-panel.open {
    display: block;
  }
  .bookmark-add {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .bookmark-add input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.9rem;
  }
  .bookmark-add button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  #bookmark-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 200px;
    overflow-y: auto;
  }
  #bookmark-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
  }
  #bookmark-list li:last-child {
    border-bottom: none;
  }
  .bookmark-item-main {
    cursor: pointer;
    flex: 1;
  }
  .bookmark-item-main:hover {
    color: var(--accent);
  }
  .bookmark-empty {
    color: #888;
    padding: 8px 4px;
  }
  .bookmark-delete {
    background: none;
    border: none;
    color: #a33;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
  }

  /* 検索パネル */
  .search-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    flex: 0 0 auto;
  }
  .search-panel.open {
    display: block;
  }

  /* 目次パネル */
  .toc-panel {
    display: none;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    max-height: 40vh;
    overflow-y: auto;
    flex: 0 0 auto;
  }
  .toc-panel.open {
    display: block;
  }
  #toc-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #toc-list li {
    padding: 8px 4px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    word-break: break-all;
  }
  #toc-list li:last-child {
    border-bottom: none;
  }
  #toc-list li:hover {
    color: var(--accent);
  }
  .toc-empty {
    color: #888;
    padding: 8px 4px;
    cursor: default;
  }
  .search-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .search-controls input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.9rem;
  }
  .search-controls button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  #search-count {
    font-size: 0.85rem;
    color: #555;
    white-space: nowrap;
    min-width: 3.5em;
    text-align: center;
  }
  #viewer-content mark.search-hit {
    background: #ffe58a;
    color: inherit;
    border-radius: 2px;
  }
  #viewer-content mark.search-hit.active {
    background: #ff9f1c;
  }

  /* 選択テキストのツールバー(Web検索・文中検索) */
  #selection-toolbar {
    display: none;
    position: fixed;
    z-index: 1000;
    gap: 6px;
  }
  #selection-toolbar.visible {
    display: flex;
  }
  #selection-toolbar button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    white-space: nowrap;
  }
  #viewer-content {
    flex: 1 1 auto;
    overflow-y: auto;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    line-height: 1.9;
    font-size: 18px;
  }
  #viewer-content h1,
  #viewer-content h2,
  #viewer-content h3,
  #viewer-content h4 {
    line-height: 1.5;
    margin: 1.6em 0 0.8em;
    color: var(--accent);
  }
  #viewer-content h1 { font-size: 1.6em; }
  #viewer-content h2 { font-size: 1.4em; }
  #viewer-content h3 { font-size: 1.2em; }
  #viewer-content p,
  #viewer-content ul,
  #viewer-content ol,
  #viewer-content blockquote {
    margin: 0.9em 0;
  }
  #viewer-content blockquote {
    margin-left: 0;
    padding: 0.2em 1em;
    border-left: 4px solid var(--border);
    color: #555;
  }
  #viewer-content code {
    background: rgba(107, 79, 59, 0.1);
    padding: 0.15em 0.4em;
    border-radius: 3px;
    font-size: 0.9em;
  }
  #viewer-content pre {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
  }
  #viewer-content pre code {
    background: none;
    padding: 0;
  }
  #viewer-content table {
    border-collapse: collapse;
    width: 100%;
  }
  #viewer-content th,
  #viewer-content td {
    border: 1px solid var(--border);
    padding: 6px 10px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- 本棚一覧画面 -->
  <section id="screen-bookshelf" class="screen active">
    <header>
      <h1>本棚</h1>
      <div class="header-actions">
        <button id="btn-drive-open" type="button">☁️ Google Drive</button>
        <button id="btn-backup-toggle" type="button">⚙ バックアップ</button>
        <button id="btn-import-files" type="button">＋ ファイルを追加</button>
        <button id="btn-open-folder" type="button">フォルダを開く</button>
      </div>
    </header>
    <div id="drive-panel" class="drive-panel">
      <div id="drive-breadcrumb" class="drive-breadcrumb"></div>
      <ul id="drive-folder-list"></ul>
      <div class="drive-actions">
        <button id="btn-drive-load-here" type="button">📥 このフォルダを読み込む</button>
      </div>
    </div>
    <div id="backup-panel" class="backup-panel">
      <button id="btn-backup-export" type="button">📤 バックアップをエクスポート</button>
      <button id="btn-backup-import" type="button">📥 バックアップをインポート</button>
      <input type="file" id="backup-import-input" accept=".json" style="display: none;">
      <p class="backup-note">しおり・既読位置・フォントサイズ設定をJSONファイルに保存/復元します(端末間の手動同期やバックアップ用)。</p>
    </div>
    <input type="file" id="file-import-input" accept=".md" multiple style="display: none;">
    <div id="bookshelf-list">
      <div class="empty-state">ファイルがまだありません。「フォルダを開く」または「ファイルを追加」から読み込んでください。</div>
    </div>
  </section>

  <!-- ビューア画面 -->
  <section id="screen-viewer" class="screen">
    <header>
      <button id="btn-back-to-bookshelf" type="button">← 本棚</button>
      <h1 id="viewer-title">タイトル</h1>
      <div class="header-actions">
        <button id="btn-toc-toggle" type="button">📑 目次</button>
        <button id="btn-search-toggle" type="button">🔍 検索</button>
        <button id="btn-bookmark-toggle" type="button">🔖 しおり</button>
        <div class="font-controls">
          <button id="btn-font-decrease" type="button" aria-label="文字を小さく">A-</button>
          <button id="btn-font-increase" type="button" aria-label="文字を大きく">A+</button>
        </div>
      </div>
    </header>
    <div id="toc-panel" class="toc-panel">
      <ul id="toc-list"></ul>
    </div>
    <div id="search-panel" class="search-panel">
      <div class="search-controls">
        <input type="text" id="search-input" placeholder="検索語を入力">
        <span id="search-count">0/0</span>
        <button id="btn-search-prev" type="button" aria-label="前へ">↑</button>
        <button id="btn-search-next" type="button" aria-label="次へ">↓</button>
      </div>
    </div>
    <div id="bookmark-panel" class="bookmark-panel">
      <div class="bookmark-add">
        <input type="text" id="bookmark-memo-input" placeholder="メモ(任意)">
        <button id="btn-bookmark-add" type="button">＋ 現在位置にしおりを追加</button>
      </div>
      <ul id="bookmark-list"></ul>
    </div>
    <div id="viewer-content"></div>
  </section>

  <div id="selection-toolbar">
    <button id="selection-search-btn" type="button">🔍 Web検索</button>
    <button id="selection-inpage-search-btn" type="button">🔎 文中検索</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  const screenBookshelf = document.getElementById('screen-bookshelf');
  const screenViewer = document.getElementById('screen-viewer');
  const btnOpenFolder = document.getElementById('btn-open-folder');
  const btnBack = document.getElementById('btn-back-to-bookshelf');
  const viewerTitle = document.getElementById('viewer-title');
  const viewerContent = document.getElementById('viewer-content');
  const bookshelfList = document.getElementById('bookshelf-list');
  const btnFontDecrease = document.getElementById('btn-font-decrease');
  const btnFontIncrease = document.getElementById('btn-font-increase');
  const btnBookmarkToggle = document.getElementById('btn-bookmark-toggle');
  const btnBookmarkAdd = document.getElementById('btn-bookmark-add');
  const bookmarkPanel = document.getElementById('bookmark-panel');
  const bookmarkMemoInput = document.getElementById('bookmark-memo-input');
  const bookmarkListEl = document.getElementById('bookmark-list');
  const btnTocToggle = document.getElementById('btn-toc-toggle');
  const tocPanel = document.getElementById('toc-panel');
  const tocListEl = document.getElementById('toc-list');
  const btnSearchToggle = document.getElementById('btn-search-toggle');
  const searchPanel = document.getElementById('search-panel');
  const searchInput = document.getElementById('search-input');
  const searchCountEl = document.getElementById('search-count');
  const btnSearchPrev = document.getElementById('btn-search-prev');
  const btnSearchNext = document.getElementById('btn-search-next');
  const selectionToolbar = document.getElementById('selection-toolbar');
  const selectionSearchBtn = document.getElementById('selection-search-btn');
  const selectionInPageSearchBtn = document.getElementById('selection-inpage-search-btn');
  const btnImportFiles = document.getElementById('btn-import-files');
  const fileImportInput = document.getElementById('file-import-input');
  const btnBackupToggle = document.getElementById('btn-backup-toggle');
  const backupPanel = document.getElementById('backup-panel');
  const btnBackupExport = document.getElementById('btn-backup-export');
  const btnBackupImport = document.getElementById('btn-backup-import');
  const backupImportInput = document.getElementById('backup-import-input');
  const btnDriveOpen = document.getElementById('btn-drive-open');
  const drivePanel = document.getElementById('drive-panel');
  const driveBreadcrumbEl = document.getElementById('drive-breadcrumb');
  const driveFolderListEl = document.getElementById('drive-folder-list');
  const btnDriveLoadHere = document.getElementById('btn-drive-load-here');

  // mdFiles の各要素: { name, relPath, source: 'fs' | 'idb' | 'drive', handle?, id?, content?, fileId? }
  let mdFiles = [];
  let fsFiles = []; // フォルダ走査で見つかったファイル(セッション限り)
  let idbFilesList = []; // IndexedDBにインポート済みのファイル(永続)
  let driveFiles = []; // Google Driveから読み込んだファイル(セッション限り)
  let currentFile = null; // 現在ビューアで開いているファイル

  function recomputeMdFiles() {
    mdFiles = [...fsFiles, ...idbFilesList, ...driveFiles].sort((a, b) => a.relPath.localeCompare(b.relPath, 'ja'));
  }

  // スマホ向けファイルインポートの永続化(IndexedDB)
  const IDB_NAME = 'mdViewerDB';
  const IDB_VERSION = 1;
  const IDB_STORE = 'files';

  function openIdb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbAddFile(name, content) {
    const db = await openIdb();
    const id = 'idb-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const record = { id, name, content, importedAt: new Date().toISOString() };
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(record);
      tx.oncomplete = () => resolve(record);
      tx.onerror = () => reject(tx.error);
    });
  }

  async function idbGetAllFiles() {
    const db = await openIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbDeleteFile(id) {
    const db = await openIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // Google Drive連携
  const GOOGLE_CLIENT_ID = '179784899748-ckb2osf9m7akhmd92cltfsls5mj25dac.apps.googleusercontent.com';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';

  let driveAccessToken = null;
  let driveTokenClient = null;
  let driveCurrentFolderId = 'root';
  let driveCurrentPath = [{ id: 'root', name: 'マイドライブ' }];

  function getDriveTokenClient() {
    if (driveTokenClient) return driveTokenClient;
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return null;
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: '' // requestDriveAccessToken内で都度差し替える
    });
    return driveTokenClient;
  }

  function requestDriveAccessToken() {
    return new Promise((resolve, reject) => {
      const client = getDriveTokenClient();
      if (!client) {
        reject(new Error('Google認証ライブラリの読み込みに失敗しました。通信環境を確認してください。'));
        return;
      }
      client.callback = (resp) => {
        if (resp.error) {
          reject(new Error('Google認証に失敗しました: ' + resp.error));
          return;
        }
        driveAccessToken = resp.access_token;
        resolve(driveAccessToken);
      };
      client.requestAccessToken();
    });
  }

  async function driveApiFetch(url) {
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + driveAccessToken } });
    if (res.status === 401) {
      driveAccessToken = null;
      throw new Error('認証の有効期限が切れました。もう一度「Google Drive」ボタンから開き直してください。');
    }
    if (!res.ok) {
      throw new Error('Drive APIエラー(status ' + res.status + ')');
    }
    return res.json();
  }

  async function listDriveChildren(folderId) {
    const q = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
    const fields = encodeURIComponent('files(id,name,mimeType)');
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&pageSize=1000&orderBy=folder,name`;
    const data = await driveApiFetch(url);
    return data.files || [];
  }

  // 指定フォルダ以下を再帰的に走査し、.mdファイルを集める
  async function scanDriveFolder(folderId, relPath) {
    const children = await listDriveChildren(folderId);
    const results = [];
    for (const child of children) {
      const entryRelPath = relPath ? relPath + '/' + child.name : child.name;
      if (child.mimeType === 'application/vnd.google-apps.folder') {
        const sub = await scanDriveFolder(child.id, entryRelPath);
        results.push(...sub);
      } else if (child.name.toLowerCase().endsWith('.md')) {
        results.push({ name: child.name, relPath: entryRelPath, source: 'drive', fileId: child.id });
      }
    }
    return results;
  }

  async function fetchDriveFileContent(fileId) {
    const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + driveAccessToken } });
    if (!res.ok) {
      throw new Error('ファイルの取得に失敗しました(status ' + res.status + ')');
    }
    return res.text();
  }

  function renderDriveBreadcrumb() {
    driveBreadcrumbEl.innerHTML = '';
    driveCurrentPath.forEach((seg, i) => {
      const isLast = i === driveCurrentPath.length - 1;
      const span = document.createElement('span');
      span.textContent = seg.name;
      span.className = 'drive-breadcrumb-item';
      if (!isLast) {
        span.addEventListener('click', () => {
          driveCurrentPath = driveCurrentPath.slice(0, i + 1);
          driveCurrentFolderId = seg.id;
          renderDriveBrowser();
        });
      }
      driveBreadcrumbEl.appendChild(span);
      if (!isLast) {
        driveBreadcrumbEl.appendChild(document.createTextNode(' / '));
      }
    });
  }

  async function renderDriveBrowser() {
    renderDriveBreadcrumb();
    driveFolderListEl.innerHTML = '<li class="drive-empty">読み込み中...</li>';
    try {
      const children = await listDriveChildren(driveCurrentFolderId);
      const folders = children.filter(c => c.mimeType === 'application/vnd.google-apps.folder');
      driveFolderListEl.innerHTML = '';
      if (folders.length === 0) {
        const li = document.createElement('li');
        li.className = 'drive-empty';
        li.textContent = 'サブフォルダはありません。「このフォルダを読み込む」で.mdファイルを取得できます。';
        driveFolderListEl.appendChild(li);
        return;
      }
      folders.forEach(folder => {
        const li = document.createElement('li');
        li.textContent = '📁 ' + folder.name;
        li.addEventListener('click', () => {
          driveCurrentPath.push({ id: folder.id, name: folder.name });
          driveCurrentFolderId = folder.id;
          renderDriveBrowser();
        });
        driveFolderListEl.appendChild(li);
      });
    } catch (err) {
      driveFolderListEl.innerHTML = '';
      const li = document.createElement('li');
      li.className = 'drive-empty';
      li.textContent = err.message;
      driveFolderListEl.appendChild(li);
    }
  }

  async function openDrivePanel() {
    drivePanel.classList.add('open');
    backupPanel.classList.remove('open');
    driveFolderListEl.innerHTML = '<li class="drive-empty">Google認証中...</li>';
    try {
      await requestDriveAccessToken();
      driveCurrentFolderId = 'root';
      driveCurrentPath = [{ id: 'root', name: 'マイドライブ' }];
      await renderDriveBrowser();
    } catch (err) {
      driveFolderListEl.innerHTML = '';
      const li = document.createElement('li');
      li.className = 'drive-empty';
      li.textContent = err.message;
      driveFolderListEl.appendChild(li);
    }
  }

  btnDriveOpen.addEventListener('click', () => {
    const willOpen = !drivePanel.classList.contains('open');
    if (willOpen) {
      openDrivePanel();
    } else {
      drivePanel.classList.remove('open');
    }
  });

  btnDriveLoadHere.addEventListener('click', async () => {
    btnDriveLoadHere.disabled = true;
    const originalLabel = btnDriveLoadHere.textContent;
    btnDriveLoadHere.textContent = '読み込み中...';
    try {
      driveFiles = await scanDriveFolder(driveCurrentFolderId, '');
      recomputeMdFiles();
      renderBookshelf();
      drivePanel.classList.remove('open');
    } catch (err) {
      alert('Driveからの読み込みに失敗しました: ' + err.message);
    } finally {
      btnDriveLoadHere.disabled = false;
      btnDriveLoadHere.textContent = originalLabel;
    }
  });

  // しおり・既読位置の永続化(localStorage)
  const READING_POS_KEY = 'mdViewer.readingPositions';
  const BOOKMARKS_KEY = 'mdViewer.bookmarks';

  function loadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (err) {
      return fallback;
    }
  }
  function saveJSON(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  let readingPositions = loadJSON(READING_POS_KEY, {}); // { relPath: scrollTop }
  let bookmarks = loadJSON(BOOKMARKS_KEY, {}); // { relPath: [{ id, scrollTop, memo, createdAt }] }

  let scrollSaveTimer = null;
  function saveReadingPosition() {
    if (!currentFile) return;
    readingPositions[currentFile.relPath] = viewerContent.scrollTop;
    saveJSON(READING_POS_KEY, readingPositions);
  }
  function flushReadingPosition() {
    clearTimeout(scrollSaveTimer);
    saveReadingPosition();
  }
  viewerContent.addEventListener('scroll', () => {
    if (!currentFile) return;
    clearTimeout(scrollSaveTimer);
    scrollSaveTimer = setTimeout(saveReadingPosition, 300);
  });
  window.addEventListener('beforeunload', flushReadingPosition);

  function renderBookmarkList() {
    bookmarkListEl.innerHTML = '';
    if (!currentFile) return;
    const list = bookmarks[currentFile.relPath] || [];
    if (list.length === 0) {
      const li = document.createElement('li');
      li.className = 'bookmark-empty';
      li.textContent = 'しおりはまだありません。';
      bookmarkListEl.appendChild(li);
      return;
    }
    list.slice().sort((a, b) => a.scrollTop - b.scrollTop).forEach(bm => {
      const li = document.createElement('li');

      const main = document.createElement('div');
      main.className = 'bookmark-item-main';
      main.textContent = bm.memo ? bm.memo : '(メモなし)';
      main.addEventListener('click', () => {
        viewerContent.scrollTop = bm.scrollTop;
        bookmarkPanel.classList.remove('open');
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'bookmark-delete';
      delBtn.type = 'button';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteBookmark(currentFile.relPath, bm.id);
      });

      li.appendChild(main);
      li.appendChild(delBtn);
      bookmarkListEl.appendChild(li);
    });
  }

  function addBookmark() {
    if (!currentFile) return;
    const memo = bookmarkMemoInput.value.trim();
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      scrollTop: viewerContent.scrollTop,
      memo,
      createdAt: new Date().toISOString()
    };
    if (!bookmarks[currentFile.relPath]) bookmarks[currentFile.relPath] = [];
    bookmarks[currentFile.relPath].push(entry);
    saveJSON(BOOKMARKS_KEY, bookmarks);
    bookmarkMemoInput.value = '';
    renderBookmarkList();
  }

  function deleteBookmark(relPath, id) {
    if (!bookmarks[relPath]) return;
    bookmarks[relPath] = bookmarks[relPath].filter(b => b.id !== id);
    saveJSON(BOOKMARKS_KEY, bookmarks);
    renderBookmarkList();
  }

  btnBookmarkToggle.addEventListener('click', () => {
    const willOpen = !bookmarkPanel.classList.contains('open');
    bookmarkPanel.classList.toggle('open', willOpen);
    if (willOpen) {
      closeSearch();
      tocPanel.classList.remove('open');
    }
  });
  btnBookmarkAdd.addEventListener('click', addBookmark);

  // ファイル内検索
  let renderedHTML = ''; // 検索ハイライトをリセットするための素のレンダリング結果
  let searchMatches = [];
  let currentMatchIndex = -1;

  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function updateSearchCount() {
    searchCountEl.textContent = searchMatches.length === 0
      ? '0/0'
      : `${currentMatchIndex + 1}/${searchMatches.length}`;
  }

  function updateActiveMatch() {
    searchMatches.forEach(m => m.el.classList.remove('active'));
    if (currentMatchIndex >= 0 && searchMatches[currentMatchIndex]) {
      const active = searchMatches[currentMatchIndex].el;
      active.classList.add('active');
      active.scrollIntoView({ block: 'center' });
    }
    updateSearchCount();
  }

  // 本文プレーンテキスト上でのオフセット(文字数)を基準に、その直後の最初の一致にジャンプする
  function jumpToMatchAfterOffset(offset) {
    if (searchMatches.length === 0) return;
    let idx = searchMatches.findIndex(m => m.offset > offset);
    if (idx === -1) idx = 0; // 見つからなければ先頭(末尾から先頭へ循環)
    currentMatchIndex = idx;
    updateActiveMatch();
  }

  function highlightMatches(query) {
    viewerContent.innerHTML = renderedHTML;
    searchMatches = [];
    currentMatchIndex = -1;
    if (!query) {
      updateSearchCount();
      return;
    }
    const regex = new RegExp(escapeRegExp(query), 'gi');
    const walker = document.createTreeWalker(viewerContent, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) {
      textNodes.push(node);
    }
    let cumulativeOffset = 0;
    textNodes.forEach(textNode => {
      const text = textNode.nodeValue;
      const nodeStartOffset = cumulativeOffset;
      cumulativeOffset += text.length;
      regex.lastIndex = 0;
      if (!regex.test(text)) return;
      regex.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let lastIndex = 0;
      let m;
      while ((m = regex.exec(text))) {
        if (m.index > lastIndex) {
          frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
        }
        const mark = document.createElement('mark');
        mark.className = 'search-hit';
        mark.textContent = m[0];
        frag.appendChild(mark);
        searchMatches.push({ el: mark, offset: nodeStartOffset + m.index });
        lastIndex = m.index + m[0].length;
      }
      if (lastIndex < text.length) {
        frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      }
      textNode.parentNode.replaceChild(frag, textNode);
    });

    if (searchMatches.length > 0) {
      currentMatchIndex = 0;
      updateActiveMatch();
    } else {
      updateSearchCount();
    }
  }

  function goToMatch(delta) {
    if (searchMatches.length === 0) return;
    currentMatchIndex = (currentMatchIndex + delta + searchMatches.length) % searchMatches.length;
    updateActiveMatch();
  }

  function closeSearch() {
    searchPanel.classList.remove('open');
    searchInput.value = '';
    if (renderedHTML) viewerContent.innerHTML = renderedHTML;
    searchMatches = [];
    currentMatchIndex = -1;
    updateSearchCount();
  }

  searchInput.addEventListener('input', () => {
    highlightMatches(searchInput.value.trim());
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      goToMatch(e.shiftKey ? -1 : 1);
    }
  });
  btnSearchPrev.addEventListener('click', () => goToMatch(-1));
  btnSearchNext.addEventListener('click', () => goToMatch(1));

  btnSearchToggle.addEventListener('click', () => {
    const willOpen = !searchPanel.classList.contains('open');
    if (willOpen) {
      searchPanel.classList.add('open');
      bookmarkPanel.classList.remove('open');
      tocPanel.classList.remove('open');
      searchInput.focus();
    } else {
      closeSearch();
    }
  });

  // 目次
  function buildToc() {
    tocListEl.innerHTML = '';
    const headings = viewerContent.querySelectorAll('h1, h2, h3, h4, h5, h6');
    if (headings.length === 0) {
      const li = document.createElement('li');
      li.className = 'toc-empty';
      li.textContent = '見出しが見つかりません。';
      tocListEl.appendChild(li);
      return;
    }
    headings.forEach((heading, i) => {
      const id = 'toc-heading-' + i;
      heading.id = id;
      const level = parseInt(heading.tagName.substring(1), 10);
      const li = document.createElement('li');
      li.textContent = heading.textContent;
      li.style.paddingLeft = ((level - 1) * 16 + 4) + 'px';
      li.addEventListener('click', () => {
        const target = document.getElementById(id);
        if (target) {
          target.scrollIntoView({ block: 'start' });
        }
        tocPanel.classList.remove('open');
      });
      tocListEl.appendChild(li);
    });
  }

  btnTocToggle.addEventListener('click', () => {
    const willOpen = !tocPanel.classList.contains('open');
    tocPanel.classList.toggle('open', willOpen);
    if (willOpen) {
      bookmarkPanel.classList.remove('open');
      closeSearch();
    }
  });

  // 選択テキストのWeb検索・文中検索
  let pendingSelectionText = '';
  let pendingSelectionOffset = 0; // viewer-content内のプレーンテキスト上でのオフセット(文字数)

  function hideSelectionButton() {
    selectionToolbar.classList.remove('visible');
    pendingSelectionText = '';
  }

  // range開始位置の、viewerContent内プレーンテキスト先頭からの文字数オフセットを求める
  function getTextOffsetInViewer(range) {
    const preRange = document.createRange();
    preRange.selectNodeContents(viewerContent);
    preRange.setEnd(range.startContainer, range.startOffset);
    return preRange.toString().length;
  }

  function showSelectionButtonForSelection() {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
      hideSelectionButton();
      return;
    }
    const text = selection.toString().trim();
    if (!text || !viewerContent.contains(selection.anchorNode)) {
      hideSelectionButton();
      return;
    }
    const range = selection.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) {
      hideSelectionButton();
      return;
    }
    pendingSelectionText = text;
    pendingSelectionOffset = getTextOffsetInViewer(range);
    selectionToolbar.classList.add('visible');
    const toolbarRect = selectionToolbar.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - toolbarRect.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - toolbarRect.width - 8));
    let top = rect.top - toolbarRect.height - 8;
    if (top < 8) top = rect.bottom + 8;
    selectionToolbar.style.left = left + 'px';
    selectionToolbar.style.top = top + 'px';
  }

  viewerContent.addEventListener('mouseup', () => {
    setTimeout(showSelectionButtonForSelection, 0);
  });
  viewerContent.addEventListener('touchend', () => {
    setTimeout(showSelectionButtonForSelection, 0);
  });
  viewerContent.addEventListener('scroll', hideSelectionButton);
  document.addEventListener('selectionchange', () => {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed) {
      hideSelectionButton();
    }
  });
  document.addEventListener('mousedown', (e) => {
    if (!selectionToolbar.contains(e.target)) {
      hideSelectionButton();
    }
  });

  selectionToolbar.addEventListener('mousedown', (e) => {
    e.preventDefault(); // 選択状態が解除されるのを防ぐ
  });
  selectionSearchBtn.addEventListener('click', () => {
    if (!pendingSelectionText) return;
    const url = 'https://www.google.com/search?q=' + encodeURIComponent(pendingSelectionText);
    window.open(url, '_blank', 'noopener,noreferrer');
    hideSelectionButton();
  });
  selectionInPageSearchBtn.addEventListener('click', () => {
    if (!pendingSelectionText) return;
    const query = pendingSelectionText;
    const fromOffset = pendingSelectionOffset;
    hideSelectionButton();
    searchPanel.classList.add('open');
    bookmarkPanel.classList.remove('open');
    searchInput.value = query;
    highlightMatches(query);
    jumpToMatchAfterOffset(fromOffset);
  });

  // フォントサイズ調整
  const FONT_SIZE_KEY = 'mdViewer.fontSize';
  const FONT_SIZE_MIN = 14;
  const FONT_SIZE_MAX = 28;
  const FONT_SIZE_DEFAULT = 18;
  const FONT_SIZE_STEP = 2;

  let fontSize = parseInt(localStorage.getItem(FONT_SIZE_KEY), 10);
  if (!fontSize || isNaN(fontSize)) fontSize = FONT_SIZE_DEFAULT;

  function applyFontSize() {
    viewerContent.style.fontSize = fontSize + 'px';
  }

  function changeFontSize(delta) {
    fontSize = Math.min(FONT_SIZE_MAX, Math.max(FONT_SIZE_MIN, fontSize + delta));
    localStorage.setItem(FONT_SIZE_KEY, String(fontSize));
    applyFontSize();
  }

  btnFontDecrease.addEventListener('click', () => changeFontSize(-FONT_SIZE_STEP));
  btnFontIncrease.addEventListener('click', () => changeFontSize(FONT_SIZE_STEP));
  applyFontSize();

  function showScreen(screen) {
    [screenBookshelf, screenViewer].forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
  }

  function renderMarkdown(text) {
    if (window.marked) {
      viewerContent.innerHTML = window.marked.parse(text);
    } else {
      // marked.js読み込み失敗時のフォールバック: 生テキスト表示
      viewerContent.textContent = text;
    }
  }

  async function openViewer(file) {
    currentFile = file;
    viewerTitle.textContent = file.name;
    viewerContent.textContent = '読み込み中...';
    bookmarkPanel.classList.remove('open');
    bookmarkMemoInput.value = '';
    searchPanel.classList.remove('open');
    searchInput.value = '';
    searchMatches = [];
    currentMatchIndex = -1;
    updateSearchCount();
    tocPanel.classList.remove('open');
    hideSelectionButton();
    showScreen(screenViewer);
    try {
      let text;
      if (file.source === 'idb') {
        text = file.content;
      } else if (file.source === 'drive') {
        text = await fetchDriveFileContent(file.fileId);
      } else {
        const fileHandle = await file.handle.getFile();
        text = await fileHandle.text();
      }
      renderMarkdown(text);
      buildToc();
      renderedHTML = viewerContent.innerHTML;
      renderBookmarkList();
      viewerContent.scrollTop = readingPositions[file.relPath] || 0;
    } catch (err) {
      viewerContent.textContent = 'ファイルの読み込みに失敗しました: ' + err.message;
      renderedHTML = viewerContent.innerHTML;
      tocListEl.innerHTML = '';
    }
  }

  btnBack.addEventListener('click', () => {
    flushReadingPosition();
    hideSelectionButton();
    showScreen(screenBookshelf);
  });

  // ディレクトリを再帰的に走査し、.mdファイルのハンドルを集める
  async function scanDirectory(dirHandle, relPath) {
    const results = [];
    for await (const [name, handle] of dirHandle.entries()) {
      const entryRelPath = relPath ? relPath + '/' + name : name;
      if (handle.kind === 'file' && name.toLowerCase().endsWith('.md')) {
        results.push({ name, relPath: entryRelPath, source: 'fs', handle });
      } else if (handle.kind === 'directory') {
        const sub = await scanDirectory(handle, entryRelPath);
        results.push(...sub);
      }
    }
    return results;
  }

  function renderBookshelf() {
    bookshelfList.innerHTML = '';
    if (mdFiles.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'ファイルがまだありません。「フォルダを開く」または「ファイルを追加」から読み込んでください。';
      bookshelfList.appendChild(empty);
      return;
    }
    mdFiles.forEach(file => {
      const item = document.createElement('div');
      item.className = 'book-item';
      item.title = file.relPath;
      item.addEventListener('click', () => openViewer(file));

      const nameEl = document.createElement('div');
      nameEl.textContent = file.name;
      item.appendChild(nameEl);

      if (file.source === 'idb') {
        const sourceEl = document.createElement('div');
        sourceEl.className = 'book-item-source';
        sourceEl.textContent = '📱 インポート';
        item.appendChild(sourceEl);

        const delBtn = document.createElement('button');
        delBtn.className = 'book-item-delete';
        delBtn.type = 'button';
        delBtn.textContent = '削除';
        delBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          await idbDeleteFile(file.id);
          idbFilesList = idbFilesList.filter(f => f.id !== file.id);
          recomputeMdFiles();
          renderBookshelf();
        });
        item.appendChild(delBtn);
      } else if (file.source === 'drive') {
        const sourceEl = document.createElement('div');
        sourceEl.className = 'book-item-source';
        sourceEl.textContent = '☁️ Drive';
        item.appendChild(sourceEl);
      }

      bookshelfList.appendChild(item);
    });
  }

  btnOpenFolder.addEventListener('click', async () => {
    if (!window.showDirectoryPicker) {
      alert('お使いのブラウザはフォルダ読み込みに対応していません。Chromebookでは「フォルダを開く」、スマホでは「ファイルを追加」をお使いください。');
      return;
    }
    try {
      const dirHandle = await window.showDirectoryPicker();
      bookshelfList.innerHTML = '';
      const loading = document.createElement('div');
      loading.className = 'empty-state';
      loading.textContent = 'フォルダを読み込み中...';
      bookshelfList.appendChild(loading);

      fsFiles = await scanDirectory(dirHandle, '');
      recomputeMdFiles();
      renderBookshelf();
    } catch (err) {
      if (err.name !== 'AbortError') {
        alert('フォルダの読み込みに失敗しました: ' + err.message);
      }
    }
  });

  btnImportFiles.addEventListener('click', () => {
    fileImportInput.click();
  });

  async function importFiles(fileList) {
    const files = Array.from(fileList || []);
    const mdOnly = files.filter(f => f.name.toLowerCase().endsWith('.md'));
    for (const f of mdOnly) {
      try {
        const content = await f.text();
        const record = await idbAddFile(f.name, content);
        idbFilesList.push({ name: record.name, relPath: record.name, source: 'idb', id: record.id, content: record.content });
      } catch (err) {
        alert(f.name + ' の読み込みに失敗しました: ' + err.message);
      }
    }
    recomputeMdFiles();
    renderBookshelf();
  }

  fileImportInput.addEventListener('change', async () => {
    await importFiles(fileImportInput.files);
    fileImportInput.value = ''; // 同じファイルを続けて選択できるようにリセット
  });

  // バックアップ(しおり・既読位置・フォント設定)のJSONエクスポート/インポート
  btnBackupToggle.addEventListener('click', () => {
    const willOpen = !backupPanel.classList.contains('open');
    backupPanel.classList.toggle('open', willOpen);
    if (willOpen) {
      drivePanel.classList.remove('open');
    }
  });

  function exportBackup() {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      readingPositions,
      bookmarks,
      fontSize
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const a = document.createElement('a');
    a.href = url;
    a.download = `md-viewer-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function importBackup(file) {
    let data;
    try {
      const text = await file.text();
      data = JSON.parse(text);
    } catch (err) {
      alert('バックアップファイルの読み込みに失敗しました: ' + err.message);
      return;
    }
    if (!data || typeof data !== 'object') {
      alert('不正なバックアップファイルです。');
      return;
    }
    if (data.readingPositions && typeof data.readingPositions === 'object') {
      readingPositions = data.readingPositions;
      saveJSON(READING_POS_KEY, readingPositions);
    }
    if (data.bookmarks && typeof data.bookmarks === 'object') {
      bookmarks = data.bookmarks;
      saveJSON(BOOKMARKS_KEY, bookmarks);
    }
    if (typeof data.fontSize === 'number' && data.fontSize >= FONT_SIZE_MIN && data.fontSize <= FONT_SIZE_MAX) {
      fontSize = data.fontSize;
      localStorage.setItem(FONT_SIZE_KEY, String(fontSize));
      applyFontSize();
    }
    alert('バックアップを復元しました。');
  }

  btnBackupExport.addEventListener('click', exportBackup);
  btnBackupImport.addEventListener('click', () => {
    backupImportInput.click();
  });
  backupImportInput.addEventListener('change', async () => {
    const file = backupImportInput.files && backupImportInput.files[0];
    if (file) {
      await importBackup(file);
    }
    backupImportInput.value = '';
  });

  async function init() {
    try {
      const records = await idbGetAllFiles();
      idbFilesList = records.map(r => ({ name: r.name, relPath: r.name, source: 'idb', id: r.id, content: r.content }));
    } catch (err) {
      idbFilesList = [];
    }
    recomputeMdFiles();
    renderBookshelf();
  }
  init();
})();
</script>
</body>
</html>
